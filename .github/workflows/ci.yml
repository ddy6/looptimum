name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run lint checks
        run: python -m ruff check .

      - name: Validate internal markdown links
        run: python scripts/check_internal_links.py --paths README.md docs quickstart client_harness_template

      - name: Validate public docs consistency
        run: python scripts/check_docs_consistency.py

      - name: Validate release metadata
        run: python scripts/check_release.py

      - name: Validate exact release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --require-clean

      - name: Validate CI playbook sync
        run: python scripts/check_ci_playbook_sync.py

      - name: Validate benchmark sanity
        run: python scripts/check_benchmark_sanity.py

      - name: Syntax check critical scripts
        run: |
          python -m py_compile \
            service/*.py \
            client_harness_template/aws_config.py \
            client_harness_template/aws_executor.py \
            client_harness_template/aws_models.py \
            client_harness_template/objective_aws_batch_example.py \
            client_harness_template/run_one_eval.py \
            scripts/check_benchmark_sanity.py \
            scripts/check_ci_playbook_sync.py \
            scripts/check_docs_consistency.py \
            scripts/check_internal_links.py \
            scripts/check_release.py \
            scripts/release_smoke.py \
            templates/bo_client/run_bo.py \
            templates/bo_client_demo/run_bo.py \
            templates/bo_client_full/run_bo.py

  test:
    name: Unit Tests (py${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q templates client_harness_template/tests service/tests

      - name: Validate public GPT evidence package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          -s docs/examples/gpt_training_campaign/tests
          -p 'test*.py' -v

  ax-test:
    name: Ax Integration (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    env:
      LOOPTIMUM_REQUIRE_AX_TESTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build portable CPU wheelhouse
        run: |
          python -m pip install --upgrade pip
          python templates/_shared/vendor_copy.py templates/bo_client "$RUNNER_TEMP/ax-installer"
          python "$RUNNER_TEMP/ax-installer/ax_install.py" build "$RUNNER_TEMP/ax-wheelhouse"
      - name: Install only hashed local wheels into a fresh environment
        run: |
          python -I -m venv "$RUNNER_TEMP/ax-offline"
          python "$RUNNER_TEMP/ax-installer/ax_install.py" install "$RUNNER_TEMP/ax-wheelhouse" \
            --python "$RUNNER_TEMP/ax-offline/bin/python" --receipt ax-installation.json
          echo "$RUNNER_TEMP/ax-offline/bin" >> "$GITHUB_PATH"
      - name: Probe public Ax APIs and model-guided restart
        run: python scripts/probe_ax_compatibility.py --output ax-compatibility.json
      - name: Install test tooling separately from the verified runtime
        run: python -I -m pip install -c templates/_shared/ax-constraints.txt 'pytest>=9,<10'
      - name: Test Ax and lean backend contracts
        run: >-
          python -m pytest -q
          --junitxml=ax-tests.xml
          templates/tests/test_ax_install.py
          templates/tests/test_ax_integration.py
          templates/tests/test_ax_recovery.py
          templates/tests/test_ax_rebuild.py
          templates/tests/test_gp_fit.py
          templates/tests/test_gp_fit_integration.py
          templates/tests/test_optimizer_backend.py
          templates/tests/test_portable_copy.py
      - name: Run mixed pipeline example
        run: >-
          python examples/ax_pipeline_tuning/run_pipeline_loop.py
          --destination /tmp/looptimum-ax-pipeline-example --steps 4 --initialization 2
      - name: Smoke backend comparison contracts
        run: >-
          python -m benchmarks.backend_comparison.run
          --output-dir /tmp/looptimum-backend-smoke
          --budget 4 --initialization 2 --seeds 17
          --workloads smooth_quadratic --workers 2
      - name: Retain installation and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ax-installation.json
            ax-compatibility.json
            ax-tests.xml
            ${{ runner.temp }}/ax-wheelhouse/manifest.json
            ${{ runner.temp }}/ax-wheelhouse/requirements.lock

  typecheck:
    name: Type Check (mypy, py3.12)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run mypy gate
        run: python -m mypy

  smoke:
    name: Release Smoke (quickstart + ops)
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run release smoke checks
        run: python scripts/release_smoke.py

      - name: Build and validate release wheel
        run: |
          python -I -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/looptimum-wheel" .
          python scripts/check_release.py --wheel "$RUNNER_TEMP"/looptimum-wheel/looptimum-*.whl
          python -I -m venv "$RUNNER_TEMP/looptimum-package-smoke"
          "$RUNNER_TEMP/looptimum-package-smoke/bin/python" -I -m pip install \
            --no-index --no-deps "$RUNNER_TEMP"/looptimum-wheel/looptimum-*.whl
          python scripts/check_release.py \
            --installed-python "$RUNNER_TEMP/looptimum-package-smoke/bin/python"
